<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Small Promo Tile - 440x280</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 440px;
    height: 280px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #cbd5e1 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 0 32px;
  }

  .left {
    flex-shrink: 0;
  }

  .icon {
    margin-bottom: 10px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #18181b;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  h1 span { color: #4ade80; }

  .subtitle {
    font-size: 11px;
    color: #52525b;
    line-height: 1.5;
  }

  .features {
    display: flex;
    gap: 12px;
    margin-top: 10px;
  }

  .feature {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 9px;
    color: #3f3f46;
    font-weight: 500;
  }

  .feature .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #4ade80;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="left">
    <div class="icon">
      <svg width="40" height="40" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="24" y="14" width="80" height="100" rx="22" fill="#FBFEF8" stroke="#193228" stroke-width="8"/>
        <path d="M42 77L58 59L70 67L88 43" stroke="#193228" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="88" cy="43" r="6" fill="#77D362"/>
      </svg>
    </div>
    <h1>FSRS Parameter<br><span>Optimizer</span></h1>
    <p class="subtitle">Optimize Anki FSRS parameters<br>in your browser with WebAssembly</p>
    <div class="features">
      <div class="feature"><span class="dot"></span> Fast</div>
      <div class="feature"><span class="dot"></span> Offline</div>
      <div class="feature"><span class="dot"></span> Private</div>
    </div>
  </div>
</body>
</html>
